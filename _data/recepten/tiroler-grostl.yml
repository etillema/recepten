naam: Tiroler Gröstl
categorie: Hoofdgerecht
keuken: Oostenrijks
bereidingstijd: 25
ingredienten:
  - aardappelen
  - ui
  - rollade
  - 1 ei per persoon
stappen:
  - Snijd de aardappelen in blokjes.
  - Snipper de ui en snijd de rollade in blokjes.
  - Bak de aardappelblokjes.
  - Bak in een andere pan eerst de ui en voeg daarna de rollade toe.
  - Voeg alles samen zodra de aardappelblokjes bruin zijn en de ui lichtbruin is.
  - Bak per persoon een ei.
  - Leg het gebakken ei op het aardappelmengsel.
tags:
  - hoofdgerecht
  - aardappel
  - rollade
  - ei
  - Oostenrijks
