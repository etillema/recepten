naam: Gnocchi ovenschotel
categorie: Ovengerecht
keuken: Italiaans
bereidingstijd: 30
oventemperatuur: 180
oventijd: 20
personen: 4
ingredienten:
  - 400 gram gnocchi
  - 1 ui
  - 2 tenen knoflook
  - 1 courgette
  - 250 gram champignons
  - 200 gram cherrytomaten
  - 2 theelepels Italiaanse kruiden
  - 425 milliliter Mutti passata
  - 150 gram kleine mozzarellabolletjes
  - 2 eetlepels groene pesto
  - olijfolie
  - peper en zout
stappen:
  - Verwarm de oven voor op 180 °C boven- en onderwarmte.
  - Kook de gnocchi volgens de aanwijzingen op de verpakking en giet af.
  - Snipper de ui en snijd de knoflook fijn.
  - Snijd de courgette in kwartjes en de champignons in plakjes. Halveer de cherrytomaten.
  - Verhit een beetje olijfolie in een koekenpan en fruit de ui en knoflook kort aan.
  - Voeg de courgette en champignons toe en bak een paar minuten mee tot ze bijna gaar zijn.
  - Voeg de cherrytomaten en de Italiaanse kruiden toe.
  - Schenk de passata erbij en breng het geheel aan de kook.
  - Schep de gnocchi erdoor zodra het kookt en breng op smaak met peper en zout.
  - Schep alles in een ovenschaal en verdeel de mozzarella en pesto erover.
  - Bak ca. 20-25 min. in de oven tot de mozzarella gesmolten en licht goudbruin is.
tips:
  - De ovenschotel kan een dag van tevoren gemaakt worden.
tags:
